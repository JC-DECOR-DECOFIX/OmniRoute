name: JC Claude continuity
on:
  pull_request:
    branches: [jc/macos-v3.8.50]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMBIENTE: desenvolvimento
      NODE_ENV: development
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      OMNIROUTE_SKIP_DNS_WRITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:core
      - run: npm run check:any-budget:t11
      - run: npm run check:docs-all
      - run: npm run check:pack-policy
      - name: Exercise routing, token rotation, pins, tools and streaming
        run: >-
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts --test
          tests/integration/claude-account-continuity.test.ts
          tests/integration/claude-terminal-fallback.test.ts
          tests/unit/claude-continuity-refresh.test.ts
          tests/unit/claude-continuity-client.test.mjs
          tests/unit/claude-continuity-oauth-scope.test.ts
          tests/unit/token-refresh-race-comprehensive.test.ts
          tests/unit/token-refresh-cas-guard-4038.test.ts
          tests/unit/token-refresh-cas-guard.test.ts
          tests/unit/refresh-serializer.test.ts
          tests/unit/oauth-refresh-error-resilience.test.ts
          tests/unit/claude-native-passthrough-tools.test.ts
          tests/unit/claude-native-client-version.test.ts
          tests/unit/claude-code-parity.test.ts
          tests/unit/stream-recovery.test.ts
          tests/unit/stream-readiness.test.ts
          tests/unit/silent-sse-close-7699.test.ts
          tests/unit/reject-management-password-as-apikey.test.ts
          tests/unit/pack-artifact-policy.test.ts
